services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    network_mode: host
    command: ["mongod", "--bind_ip", "127.0.0.1", "--port", "27017"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  ctf-backend:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    cpus: 1.0
    group_add:
      - "990"
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MONGODB_URI: mongodb://127.0.0.1:27017/rubixctf
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      WEBSHELL_ENABLED: "true"
      PORT: "5000"
    depends_on:
      mongo:
        condition: service_healthy
      webshell-image:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:5000/healthz").then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ./client
      args:
        REACT_APP_WEBSHELL_ENABLED: "true"
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      ctf-backend:
        condition: service_healthy
      web-challenge-1:
        condition: service_started
      unfiltered_ping:
        condition: service_started
      cookie_jar:
        condition: service_started

  web-challenge-1:
    build: ./web-challenge-1
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:80"

  webshell-image:
    image: kali-ctf-webshell
    build:
      context: ./server
      dockerfile: Dockerfile
    entrypoint: ["true"]
    restart: "no"
    network_mode: none
    cap_drop:
      - ALL

  unfiltered_ping:
    build: ./unfiltered_ping
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    ports:
      - "127.0.0.1:9000:80"

  cookie_jar:
    build: ./cookie-challenge
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:10000:80"

volumes:
  mongo_data:
